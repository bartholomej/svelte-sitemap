name: 🧪 Build and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: 🧪 Build and Test

    steps:
      - uses: actions/checkout@v7

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🧹 Lint
        run: yarn eslint .

      - name: 🔎 Typecheck
        run: yarn typecheck

      - name: 🏗️ Build app
        run: yarn build

      - name: 🧪 Tests
        run: yarn test:coverage

      - name: Run tests with outDir
        run: yarn test:outdir

      - name: 📦 Pack package
        run: cd dist && npm pack

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/*.tgz

      # - name: Upload code coverage
      #   run: bash <(curl -s https://codecov.io/bash)

  node20:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: 🧪 Node 20 smoke test

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - name: 📦 Install package into an empty project
        run: |
          mkdir smoke && cd smoke
          npm init -y > /dev/null
          npm install ../package/*.tgz
          cp -r ../src/build build

      - name: CLI
        working-directory: smoke
        run: |
          npx svelte-sitemap --version
          npx svelte-sitemap --domain https://example.com
          grep -q '<loc>https://example.com/page1</loc>' build/sitemap.xml

      - name: Config file
        working-directory: smoke
        run: |
          rm build/sitemap.xml
          echo "export default { domain: 'https://example.com', trailingSlashes: true };" > svelte-sitemap.config.ts
          npx svelte-sitemap
          grep -q '<loc>https://example.com/page1/</loc>' build/sitemap.xml
          rm svelte-sitemap.config.ts

      - name: API
        working-directory: smoke
        run: |
          rm build/sitemap.xml
          node --input-type=module -e "import { createSitemap } from 'svelte-sitemap'; await createSitemap({ domain: 'https://example.com' });"
          grep -q '<loc>https://example.com/page1</loc>' build/sitemap.xml
